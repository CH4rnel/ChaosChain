services:
  explorer:
    build:
      context: .
      args:
        PING_REF: ${PING_REF:?pin a reviewed Ping commit SHA}
        PUBLIC_URL: ${PUBLIC_URL:?set the public explorer URL}
        CHAIN_ID: ${CHAIN_ID:?set the ChaosChain chain ID}
    image: chaoschain-ping:${PING_REF}
    network_mode: host
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      NODE_HOST: ${NODE_HOST:-127.0.0.1}
      NODE_API_PORT: ${NODE_API_PORT:-1317}
      NODE_RPC_PORT: ${NODE_RPC_PORT:-26657}
      LISTEN_HOST: ${LISTEN_HOST:-127.0.0.1}
      LISTEN_PORT: ${LISTEN_PORT:-8080}
      PUBLIC_ORIGIN: ${PUBLIC_URL}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${LISTEN_PORT}/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
