# .golangci.yml
version: "2"

run:
  timeout: 5m
  issues-exit-code: 1

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - revive
    - gosec
    - bodyclose
    - misspell
    - unconvert
    - unparam
    - gocritic
    - exhaustive
    - copyloopvar
  settings:
    gosec:
      severity: medium
      confidence: medium
    revive:
      rules:
        - name: exported
          severity: warning
        - name: blank-imports
          severity: warning

issues:
  max-issues-per-linter: 0
  max-same-issues: 0